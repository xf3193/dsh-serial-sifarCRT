name: Publish to npm

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Publish (requires the NPM_TOKEN repository secret)
        if: env.NODE_AUTH_TOKEN != ''
        run: npm publish --access public --provenance
      - name: Explain when the secret is missing
        if: env.NODE_AUTH_TOKEN == ''
        run: echo "Add the NPM_TOKEN repository secret (GitHub Settings -> Secrets and variables -> Actions) to enable npm publishing."
